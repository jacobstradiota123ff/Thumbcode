name: Build ThumbCode Play Console AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36 Platform & Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies, generate icon & scaffold Android
        run: |
          npm install
          npm install --no-save sharp @capacitor/assets
          mkdir -p resources
          node -e "const sharp = require('sharp'); sharp('assets/icon.svg').resize(1024, 1024).png().toFile('resources/icon.png');"
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx capacitor-assets generate --android --iconBackgroundColor '#0d1117'
          npx cap sync android

      - name: Enforce API 36 & Auto-Increment versionCode
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      - name: Decode or Generate Upload Keystore & Build Signed AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "⚠️ No KEYSTORE_BASE64 secret found — generating temporary upload keystore..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias thumbcode \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass thumbcode123 -keypass thumbcode123 \
              -dname "CN=Jake of Many Trades, OU=Dev, O=Jake of Many Trades, L=Marysville, ST=CA, C=US"
            STORE_PASS="thumbcode123"
            ALIAS="thumbcode"
            KEY_PASS="thumbcode123"
          fi

          cat << 'GRADLE' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("CI_STORE_PASS")
                      keyAlias System.getenv("CI_KEY_ALIAS")
                      keyPassword System.getenv("CI_KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

          cd android
          chmod +x gradlew
          CI_STORE_PASS="$STORE_PASS" CI_KEY_ALIAS="$ALIAS" CI_KEY_PASS="$KEY_PASS" ./gradlew bundleRelease assembleDebug

      - name: Collect flat release files & upload
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/bundle/release/app-release.aab release-files/ThumbCode-v${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/ThumbCode-v${{ github.run_number }}.apk
          cp resources/icon.png release-files/ThumbCode-icon.png

      - name: Upload Clean Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThumbCode-v${{ github.run_number }}
          path: release-files/
