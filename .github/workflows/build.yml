name: ThumbCode Dual-Platform Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS IPA (uses macOS runner minutes)"
        required: true
        default: false
        type: boolean

jobs:
  build-android:
    name: Android APK & AAB (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies & sync Capacitor Android
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Build Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ThumbCode-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ThumbCode-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

  build-ios-unsigned:
    name: iOS Unsigned IPA (Manual Only - Zero Auto Apple Minutes)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios == true
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies & sync Capacitor iOS
        run: |
          npm ci || npm install
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/ThumbCode.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r $RUNNER_TEMP/ThumbCode.xcarchive/Products/Applications/App.app $RUNNER_TEMP/ipa/Payload/
          cd $RUNNER_TEMP/ipa
          zip -qr $RUNNER_TEMP/ThumbCode-unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThumbCode-iOS-Unsigned-IPA
          path: ${{ runner.temp }}/ThumbCode-unsigned.ipa
